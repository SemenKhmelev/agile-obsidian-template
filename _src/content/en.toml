[meta]
lang = 'en'
title = 'agile-obsidian — a sprint as a folder of files'
description = 'An Obsidian vault for team sprints: configured plugins, our own scripts, templates and reports, a working process. Board, time tracking and roadmap as markdown files in your own git repository.'
alt_lang_href = '../'
alt_lang_label = 'RU'
alt_lang_full = 'Русский'
repo_url = 'https://github.com/SemenKhmelev/agile-obsidian-template'
skip_link = 'Skip to content'

