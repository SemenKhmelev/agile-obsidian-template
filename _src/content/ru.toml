[hero]
eyebrow = 'Шаблон Obsidian для командных спринтов'
title = 'Спринт — это папка с файлами'
lead = 'Хранилище Obsidian, собранное под разработку по спринтам: настроенные плагины, свои скрипты и шаблоны, готовый процесс. Доска, учёт времени, отчёты и роадмап хранятся markdown-файлами в вашем git-репозитории.'
cta_primary = 'Забрать шаблон'
cta_secondary = 'Как это устроено'
note = '159 спринтов в команде из 12 человек · MIT · всё содержимое в обычном тексте'
shot_alt = 'Kanban-доска спринта в Obsidian: колонки задач, панель аватарок участников слева, на карточках дробь «потрачено / оценка»'

[stack]
title = 'Из чего это собрано'
lead = 'Вы клонируете репозиторий и открываете его в Obsidian. Внутри уже лежит всё, что нужно команде для работы по спринтам: настроенные плагины, наши скрипты и шаблоны, демо-пример и сам процесс.'

[[stack.cards]]
title = 'Obsidian как рабочее место'
text = 'Локальные markdown-файлы, мгновенный поиск по всем спринтам, горячие клавиши, предпросмотр ссылок и палитра команд. Редактор бесплатный и ставится на все платформы.'

[[stack.cards]]
title = 'Плагины, уже настроенные'
text = 'Kanban, Dataview, Templater, Charts, QuickAdd и Obsidian Git лежат в репозитории вместе с настройками. После клонирования донастраивать нечего.'

[[stack.cards]]
title = 'Наши скрипты, вьюхи и шаблоны'
text = 'Панель аватарок и лента записей на доске, дроби «потрачено / оценка», отчёты спринта, роадмап с диаграммой Ганта, шаблоны записи за день, задачи и долга, скрипт создания следующего спринта.'

[[stack.cards]]
title = 'Готовый процесс'
text = 'Спринтовая схема, близкая к Scrum: планирование, ежедневный учёт времени, доска, ретро по отчётам. Схема обкатана командой, а не придумана для витрины.'

[data]
title = 'Данные в вашем репозитории'
lead = 'В трекере остаются решения команды, затраченное время и причины изменений. В agile-obsidian эти записи хранятся в файлах, вместе с историей изменений в git.'

[[data.cards]]
title = 'Записи пережили смену инструмента'
text = 'Наше расширение для учёта времени перестало работать с устареванием браузерной технологии. Сам проект сменил владельца. Записи сохранились в файлах.'

[[data.cards]]
title = 'У каждого есть локальная копия'
text = 'Полная копия репозитория лежит на диске у каждого участника команды. Доступ к этим файлам не зависит от тарифа сервиса или статуса аккаунта.'

[[data.cards]]
title = 'Открывайте в привычном редакторе'
text = 'Markdown с YAML-заголовком можно редактировать в Obsidian, VS Code или vim. Те же файлы доступны для поиска через `grep`, скриптов на Python и AI-агентов.'

[text]
title = 'Одна строка — три представления'
lead = 'Добавьте строку в запись за день. Доска и отчёт прочитают её из того же файла и покажут потраченное время по задаче.'
tab_markdown = 'Markdown'
tab_board = 'Доска'
tab_report = 'Отчёт'
caption_markdown = 'В строке записи за день указываются ссылка на задачу, тип деятельности и часы.'
caption_board = 'Та же задача на доске. Дробь «потрачено / оценка» стоит на карточке, при перерасходе она краснеет — как у соседней задачи в review.'
caption_report = 'Отчёт спринта собирает оценку, факт и точность из записей.'
board_alt = 'Фрагмент доски спринта: колонки review и done, подсвечена карточка «Ошибка на открытии bpmn-фрейма» с дробью 39/55'
report_alt = 'Отчёт по задачам спринта: таблица с оценкой, потраченным временем и состоянием задач'

[agents]
title = 'Как AI-агент работает с задачами'
lead = 'AI-агент читает задачи и записи о времени прямо из репозитория. Правки вносит в те же markdown-файлы, с которыми работает команда.'
terminal_caption = 'Работа агента с файлами трекера'
left_title = 'Доступ к сервису через API'
left_items = [
  'Зарегистрировать OAuth-приложение и хранить его секрет',
  'Разобраться в схеме данных и версиях API',
  'Учитывать лимиты запросов при выборке данных',
  'Настроить MCP-сервер или написать код для обращения к API',
  'Собирать контекст проекта из ответов на запросы',
  'Проверять изменения агента в интерфейсе сервиса',
]
right_title = 'Папка с файлами'
right_items = [
  'Перейти в каталог репозитория через `cd`',
  'Искать записи по всем спринтам через `grep`',
  'Редактировать строки в файле задачи',
  'Передать историю задачи по спринтам в контекст модели',
  'Проверять правки агента через `git diff`',
  'Отменять коммиты агента командой `git revert`',
]

[[agents.points]]
title = 'Поиск по записям'
text = 'Команда `grep -r "action:: dev" sprint2/comments` находит записи о разработке в спринте.'

[[agents.points]]
title = 'Запись времени'
text = 'Агент добавляет `[spent:: 2]` в строку записи за день. Формат тот же, что при ручном вводе.'

[[agents.points]]
title = 'История задачи'
text = 'Поле `previous` связывает копии задачи в разных спринтах. По этим ссылкам можно собрать её историю для модели.'

[[agents.points]]
title = 'Проверка изменений'
text = 'В `git diff` видны изменённые строки. Если правки уже закоммичены, отменить коммит можно через `git revert`.'

[workflow]
title = 'Цикл спринта'
lead = 'Каждые две недели команда проходит шесть шагов. Скрипт готовит новый спринт, участники ведут задачи и записи о времени, а отчёты собирают данные к ретро.'
footnote = 'Каждый ведёт свой файл дня, поэтому конфликты при слиянии редки.'

[[workflow.steps]]
num = '01'
title = 'Создайте новый спринт'
text = 'Скрипт `create_new_sprint.py` копирует структуру прошлого спринта, убирает завершённое, переносит хвосты, проставляет ссылки на предыдущие версии задач и переключает настройки плагинов на новый каталог.'
shot = ''
shot_alt = ''

[[workflow.steps]]
num = '02'
title = 'Задачи и доска спринта'
text = 'В файле задачи указаны оценка, чеклист этапов и ссылка на прошлый спринт. Kanban-плагин редактирует доску в файле `board.md`. Он хранится в git, поэтому расположение колонок общее для команды.'
shot = 'board.webp'
shot_alt = 'Доска спринта с колонками и карточками задач'

[[workflow.steps]]
num = '03'
title = 'Учёт времени за день'
text = 'Создайте файл дня кнопкой на панели. Горячая клавиша добавит строку для задачи, типа деятельности и часов. Ввод с клавиатуры занимает меньше минуты за день.'
shot = 'daily.webp'
shot_alt = 'Запись за день в редакторе Obsidian: строки учёта времени по задачам'

[[workflow.steps]]
num = '04'
title = 'Работа участников'
text = 'Аватарки слева фильтруют доску по человеку, правый клик открывает сквозную ленту его записей за все спринты. На карточке — дробь «потрачено / оценка», красная при перерасходе.'
shot = 'feed.webp'
shot_alt = 'Лента записей участника: дни сверху вниз, часы, тип деятельности и ссылки на задачи'

[[workflow.steps]]
num = '05'
title = 'Отчёты для ретро'
text = 'Отчёты показывают точность оценок, распределение часов по типам деятельности, перегрузки по дням и сопутствующую деятельность рядом с двумя прошлыми спринтами.'
shot = 'charts.webp'
shot_alt = 'Графики отчёта: распределение потраченного времени по типам деятельности'

[[workflow.steps]]
num = '06'
title = 'Обмен изменениями'
text = 'В палитре команд закреплены `Git: Pull` и `Git: Commit-and-sync`: первая забирает правки команды, вторая отправляет ваши. Автоматический бэкап выключен, изменения уходят на сервер по вашей команде.'
shot = 'palette.webp'
shot_alt = 'Палитра команд Obsidian: сверху закреплены команды Git: Pull и Git: Commit-and-sync'

[features]
title = 'Что внутри'
lead = 'В шаблон включены плагины и скрипты. Два демо-спринта вымышленной команды показывают, как устроена работа.'
roadmap_alt = 'Визуализация роадмапа: видения, темы и эпики в виде иерархии'
timeline_alt = 'Диаграмма Ганта по темам и эпикам роадмапа'

[[features.items]]
title = 'Учёт времени по типам деятельности'
text = 'Тип деятельности задаётся в строке: разработка, дизайн, ритуалы или поддержка'

[[features.items]]
title = 'Дробь «потрачено / оценка»'
text = 'На карточке, в ленте и в отчётах, с подсветкой перерасхода'

[[features.items]]
title = 'Сквозная история задачи'
text = 'Копии задачи связаны между спринтами; потраченное время суммируется'

[[features.items]]
title = 'Временной долг'
text = 'Недоработанные часы фиксируются и закрываются отработкой'

[[features.items]]
title = 'Отчёты спринта'
text = 'Точность оценок, часы по людям и дням, графики по типам деятельности'

[[features.items]]
title = 'Roadmap'
text = 'Видения, темы и эпики, связанные со спринтовыми задачами'

[[features.items]]
title = 'Диаграмма Ганта'
text = 'Сроки меняются перетаскиванием полос прямо на диаграмме'

[[features.items]]
title = 'Фильтр по аватаркам и лента участника'
text = 'Доска фильтруется кликом, лента открывается правым кликом'

[limits]
title = 'Ограничения'
lead = 'При выборе шаблона стоит учесть несколько ограничений.'
items = [
  'Уведомления и упоминания не поддерживаются.',
  'Доступ к репозиторию открывает весь спринт. Настроить права точнее нельзя.',
  'Бэклог ограничен текущим спринтом. Дальнейшее планирование ведётся отдельно.',
  'На доске возможны мердж-конфликты. Частый обмен изменениями снижает их вероятность.',
  'Шаблон рассчитан на небольшую команду. Для двухсот человек нужен корпоративный трекер.',
]

[start]
title = 'Попробовать'
lead = 'Открыть первую доску можно за пять минут, включая установку Obsidian.'
command = 'git clone https://github.com/SemenKhmelev/agile-obsidian-template.git'
copy = 'Скопировать'
copied = 'Скопировано'

[[start.steps]]
title = 'Установить Obsidian'
text = 'Бесплатно, на всех платформах.'

[[start.steps]]
title = 'Клонировать репозиторий'
text = 'Выполните команду выше, чтобы скачать шаблон.'

[[start.steps]]
title = 'Открыть папку как хранилище'
text = 'При открытии Obsidian попросит подтвердить доверие автору хранилища. Подтвердите, чтобы использовать включённые в шаблон плагины и настройки.'

[[start.steps]]
title = 'Посмотреть демо и добавить свои данные'
text = 'В шаблоне два демо-спринта с вымышленной командой. Как перейти на свою — в CONTRIBUTING.'

